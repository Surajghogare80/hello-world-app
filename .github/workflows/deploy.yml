name: Deploy Next.js to Azure VM

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

  deploy:
    name: Deploy to Azure Linux VM
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set SSH key permissions
        run: chmod 600 ./vm-key.pem

      - name: Deploy to Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ./vm-key.pem \
            azureuser@20.225.50.36 << 'EOF'

            set -e

            echo "===================================="
            echo "Starting deployment"
            echo "===================================="

            cd /home/azureuser/hello-world-app

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/master

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Restarting Next.js application..."

            if pm2 describe hello-world > /dev/null 2>&1; then
              pm2 restart hello-world
            else
              pm2 start npm --name "hello-world" -- start
            fi

            pm2 save

            echo "===================================="
            echo "Deployment completed"
            echo "===================================="

            pm2 status

          EOF